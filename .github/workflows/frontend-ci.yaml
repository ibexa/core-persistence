name: Frontend build

on:
    push:
        paths:
            - "**.js"
            - "package.json"
        branches:
            - '[0-9]+.[0-9]+'
    pull_request:
        paths:
            - "**.js"
            - "package.json"

jobs:
    frontend-test:
        name: Frontend build test
        runs-on: "ubuntu-26.04"
        timeout-minutes: 5

        steps:
            -   uses: actions/checkout@v7
            -   uses: actions/setup-node@v7
                with:
                    node-version: '24'
            -   run: yarn install
            -   run: yarn test
